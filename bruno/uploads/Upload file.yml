info:
  name: Upload file
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/site/uploads"
  body:
    type: multipart-form
    data:
      - name: document
        type: file
        value:
          - _assets/sample.md
        contentType: text/markdown; charset=utf-8
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
