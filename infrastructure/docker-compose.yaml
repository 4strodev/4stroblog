services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    restart: always
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: s3cretMinio
    volumes:
      - ./data:/data
      - ./minio/minio.license:/minio.license:ro
    command: server /data --console-address ":9001"

  4stroblog:
    build:
      context: ../
      dockerfile: ./packages/Dockerfile
    restart: always
    container_name: 4stroblog
    environment:
      PORT: 3000
    ports:
      - 3000:3000
    volumes:
      - "./site/views:/app/site/views"
      - "./site/uploads:/app/site/uploads"
      - "./site/config:/app/site/config"
